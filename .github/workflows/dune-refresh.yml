name: Dune Cache Refresh

on:
  schedule:
    - cron: '0 5 * * *'  # daily 05:00 UTC (1 hour before Supabase keep-alive)
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh Dune cache
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/dune-refresh.mjs

      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 Dune cache refresh failed!"
          echo "Timestamp: $(date -u)"
          echo "Check the logs above for per-chart errors."
